<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Configuracion</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="tarjeta">
        <h1>Configuracion</h1>
        <form id="form">
            <h2>Red WiFi</h2>
            <label>SSID
                <input name="ssid" required maxlength="32" placeholder="MiRed">
            </label>
            <label>Contrasena
                <input name="pass" type="password" maxlength="63" placeholder="vacio = red abierta">
            </label>

            <h2>TCP</h2>
            <label>Puerto interno
                <input name="puerto_int" type="number" min="1" max="65535" required placeholder="1234">
            </label>
            <button type="submit">Aceptar</button>
        </form>
        <p id="mensaje"></p>
    </main>
    <script src="config.js"></script>
</body>
</html>
