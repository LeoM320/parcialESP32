<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>ESP32</title>
</head>
<body>
<h1>ESP32</h1>

<p>LED 1 <button onclick="led(1, 1)">Prender</button> <button onclick="led(1, 0)">Apagar</button></p>
<p>LED 2 <button onclick="led(2, 1)">Prender</button> <button onclick="led(2, 0)">Apagar</button></p>
<p>LED 3 <button onclick="led(3, 1)">Prender</button> <button onclick="led(3, 0)">Apagar</button></p>
<p>LED 4 <button onclick="led(4, 1)">Prender</button> <button onclick="led(4, 0)">Apagar</button></p>

<pre id="estado">...</pre>

<p><a href="/wifi.html">Configurar WiFi</a></p>

<script>
// Pide /led?n=..&v=.. y despues refresca el estado
function led(n, v) {
  fetch('/led?n=' + n + '&v=' + v).then(actualizar);
}

// Pide /estado y lo muestra tal cual
function actualizar() {
  fetch('/estado')
    .then(r => r.text())
    .then(t => document.getElementById('estado').textContent = t)
    .catch(() => document.getElementById('estado').textContent = 'Sin conexion');
}

actualizar();
setInterval(actualizar, 1000);   // cada 1 s
</script>
</body>
</html>
