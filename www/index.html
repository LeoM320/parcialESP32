<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCARA ESP32 - Telemetria</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container py-4" style="max-width: 720px;">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<div>
			<h3 class="mb-0">Robot SCARA 2DOF</h3>
			<small class="text-secondary">WiFi STA (<span id="ssid">-</span>): <strong id="ip" class="text-info">0.0.0.0</strong> | AP: <strong class="text-light">192.168.4.1</strong></small>
		</div>
		<span id="modo" class="badge bg-primary fs-6">MODO A</span>
	</div>
	<div class="row g-3 mb-3">
		<div class="col-md-6">
			<div class="card bg-secondary text-white shadow-sm">
				<div class="card-body">
					<h5 class="card-title">Articulacion 1 (Hombro)</h5>
					<p class="mb-1">Angulo: <strong id="ang1" class="fs-4">0.0&deg;</strong> <small id="adc1" class="text-light">(0)</small></p>
					<p class="mb-0">Potencia (PWR1): <strong id="pwr1" class="fs-5">0</strong></p>
				</div>
			</div>
		</div>
		<div class="col-md-6">
			<div class="card bg-secondary text-white shadow-sm">
				<div class="card-body">
					<h5 class="card-title">Articulacion 2 (Codo)</h5>
					<p class="mb-1">Angulo: <strong id="ang2" class="fs-4">0.0&deg;</strong> <small id="adc2" class="text-light">(0)</small></p>
					<p class="mb-0">Potencia (PWR2): <strong id="pwr2" class="fs-5">0</strong></p>
				</div>
			</div>
		</div>
	</div>
	<div class="card bg-secondary text-white shadow-sm">
		<div class="card-body">
			<h5 class="card-title mb-3">Estado y Finales de Carrera</h5>
			<div class="d-flex flex-wrap gap-2">
				<span id="pen" class="badge bg-dark p-2 fs-6">PEN: ARRIBA</span>
				<span id="lim" class="badge bg-success p-2 fs-6">LIMIT_SW: OK</span>
				<span id="a1l" class="badge bg-dark p-2 fs-6">ARM1_L</span>
				<span id="a1r" class="badge bg-dark p-2 fs-6">ARM1_R</span>
				<span id="a2l" class="badge bg-dark p-2 fs-6">ARM2_L</span>
				<span id="a2r" class="badge bg-dark p-2 fs-6">ARM2_R</span>
			</div>
		</div>
	</div>
</div>
<script>
function actualizar(){
	fetch('/estado').then(r => r.json()).then(d => {
		document.getElementById('ang1').innerHTML = d.ang1.toFixed(1) + '&deg;';
		document.getElementById('ang2').innerHTML = d.ang2.toFixed(1) + '&deg;';
		document.getElementById('adc1').textContent = '(' + d.adc1 + ')';
		document.getElementById('adc2').textContent = '(' + d.adc2 + ')';
		document.getElementById('pwr1').textContent = d.pwr1;
		document.getElementById('pwr2').textContent = d.pwr2;
		document.getElementById('ssid').textContent = d.ssid;
		document.getElementById('ip').textContent = d.ip;
		document.getElementById('modo').textContent = 'MODO ' + d.modo;
		document.getElementById('modo').className = 'badge fs-6 ' + (d.modo === 'A' ? 'bg-primary' : 'bg-warning text-dark');
		const st = d.state;
		const pen = (st & 1) !== 0;
		const lim = (st & 2) !== 0;
		document.getElementById('pen').textContent = pen ? 'PEN: ABAJO' : 'PEN: ARRIBA';
		document.getElementById('pen').className = 'badge p-2 fs-6 ' + (pen ? 'bg-info text-dark' : 'bg-dark');
		document.getElementById('lim').textContent = lim ? 'LIMIT_SW: ACTIVO' : 'LIMIT_SW: OK';
		document.getElementById('lim').className = 'badge p-2 fs-6 ' + (lim ? 'bg-danger' : 'bg-success');
		const topes = [['a1l', 4], ['a1r', 8], ['a2l', 16], ['a2r', 32]];
		topes.forEach(([id, bit]) => {
			document.getElementById(id).className = 'badge p-2 fs-6 ' + ((st & bit) ? 'bg-danger' : 'bg-dark');
		});
	}).catch(() => {});
}
setInterval(actualizar, 250);
actualizar();
</script>
</body>
</html>
