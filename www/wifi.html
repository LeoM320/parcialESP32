<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>WiFi</title>
</head>
<body>
<h1>Configurar WiFi</h1>
<form method="POST" action="/wifi">
<p>Red (SSID): <input name="ssid" maxlength="32" required></p>
<p>Clave: <input name="pass" type="password" maxlength="64"></p>
<p><button type="submit">Guardar</button></p>
</form>
<p><a href="/">Volver</a></p>
</body>
</html>
